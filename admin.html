<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ميكسات | لوحة التحكم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<!-- ==========================================
     صفحة تسجيل الدخول
     ========================================== -->
<div id="login-page" style="display:none">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-text">ميكسات</div>
    </div>
    <div class="login-subtitle">🔐 لوحة التحكم · Admin Dashboard</div>

    <form class="login-form" id="login-form">
      <div>
        <label class="login-label">البريد الإلكتروني</label>
        <input type="email" class="login-input" id="login-email"
          value="admin@mixat.com"
          placeholder="admin@mixat.com" required autocomplete="username" />
      </div>
      <div>
        <label class="login-label">كلمة السر</label>
        <input type="password" class="login-input" id="login-pass"
          placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="login-btn">
        <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
      </button>
    </form>

    <div class="login-back">
      <a href="index.html"><i class="fas fa-arrow-right"></i> العودة للموقع</a>
    </div>
  </div>
</div>

<!-- ==========================================
     الداشبورد الرئيسي
     ========================================== -->
<div id="dashboard">

  <!-- الشريط الجانبي -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">ميكسات</div>
      <div class="sidebar-role">🔐 لوحة التحكم</div>
    </div>

    <nav class="sidebar-nav">
      <a class="sidebar-link active" data-page="dashboard">
        <i class="fas fa-chart-pie"></i> الرئيسية
      </a>

      <div class="sidebar-sep"></div>

      <a class="sidebar-link" data-page="menu">
        <i class="fas fa-utensils"></i> المنيو
      </a>
      <a class="sidebar-link" data-page="categories">
        <i class="fas fa-th-large"></i> الفئات
      </a>
      <a class="sidebar-link" data-page="offers">
        <i class="fas fa-tag"></i> العروض
      </a>
      <a class="sidebar-link" data-page="bestSellers">
        <i class="fas fa-fire"></i> الأكثر طلباً
      </a>

      <div class="sidebar-sep"></div>

      <a class="sidebar-link" data-page="reviews">
        <i class="fas fa-star"></i> التقييمات
        <span class="badge-count" id="reviews-badge" style="display:none">0</span>
      </a>

      <div class="sidebar-sep"></div>

      <a class="sidebar-link" data-page="settings">
        <i class="fas fa-cog"></i> الإعدادات
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="index.html" class="sidebar-footer-link">
        <i class="fas fa-globe"></i> عرض الموقع
      </a>
      <button class="sidebar-footer-link danger" id="logout-btn">
        <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
      </button>
    </div>
  </aside>

  <!-- المحتوى الرئيسي -->
  <main id="main-content">
    <!-- الشريط العلوي -->
    <div class="top-bar">
      <!-- زر القائمة للموبايل -->
      <button class="hamburger-btn" id="sidebar-toggle" aria-label="فتح القائمة">
        <span></span><span></span><span></span>
      </button>
      <div class="top-bar-title" id="top-bar-title">
        لوحة التحكم الرئيسية
      </div>
      <div class="top-bar-actions">
        <div class="top-bar-user">
          <div class="user-dot"></div>
          أدمن ميكسات
        </div>
      </div>
    </div>

    <!-- محتوى الصفحة -->
    <div class="page-content" id="page-content">
      <!-- تتعبأ من JavaScript -->
      <div style="text-align:center;padding:80px;color:var(--text-400)">
        <div style="font-size:2.5rem;margin-bottom:12px">⏳</div>
        <p>جاري التحميل...</p>
      </div>
    </div>
  </main>

</div>

<!-- طبقة التعتيم للموبايل -->
<div id="sidebar-overlay"></div>

<!-- سكريبتات -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
